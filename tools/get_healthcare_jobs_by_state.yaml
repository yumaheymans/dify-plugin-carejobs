identity:
  name: "get_healthcare_jobs_by_state"
  author: "yumaheymans"
  label:
    en_US: "Get Healthcare Jobs by State"
description:
  human:
    en_US: "Open healthcare jobs in a US state: by kind of job, posted hourly pay, the towns and employers with the most jobs and the newest jobs. Leave the state empty to compare every state."
  llm: "With no state, every US state's open healthcare jobs and employers. With a state, its open jobs by kind of job, the hourly pay its jobs post, the towns and employers with the most jobs and its newest jobs. With a state and a kind of job, the same for that job in that state (e.g. CNA jobs in Ohio)."
parameters:
  - name: state
    type: string
    required: false
    label:
      en_US: "US state"
    human_description:
      en_US: "A US state: two-letter code (TX) or name (Texas). Leave empty to list every state."
    llm_description: "A US state: its two-letter code (for example 'TX', 'NY') or its name ('Texas'). Leave empty to get every US state's open jobs and employers."
    form: llm
  - name: kind
    type: select
    required: false
    label:
      en_US: "Kind of job"
    human_description:
      en_US: "Optional, with a state: narrow to one kind of job, for example CNA jobs in Ohio."
    llm_description: "With a state: one kind of job. One of: 'nurses' (Nurses), 'nurse-practitioners' (NPs & PAs), 'physicians' (Doctors), 'nursing-assistants' (CNAs & PCTs), 'caregivers' (Caregivers), 'therapy-rehab' (Therapy & rehab), 'mental-health' (Mental health), 'pharmacy' (Pharmacy), 'imaging' (Imaging), 'lab' (Lab), 'surgical-techs' (Surgical), 'emts-paramedics' (EMS), 'medical-assistants' (Medical assistants), 'dental' (Dental), 'admin' (Front desk & admin), 'allied-health' (Allied health), 'ai-training' (AI training)."
    form: llm
    options:
      - value: "nurses"
        label:
          en_US: "Nurses"
      - value: "nurse-practitioners"
        label:
          en_US: "NPs & PAs"
      - value: "physicians"
        label:
          en_US: "Doctors"
      - value: "nursing-assistants"
        label:
          en_US: "CNAs & PCTs"
      - value: "caregivers"
        label:
          en_US: "Caregivers"
      - value: "therapy-rehab"
        label:
          en_US: "Therapy & rehab"
      - value: "mental-health"
        label:
          en_US: "Mental health"
      - value: "pharmacy"
        label:
          en_US: "Pharmacy"
      - value: "imaging"
        label:
          en_US: "Imaging"
      - value: "lab"
        label:
          en_US: "Lab"
      - value: "surgical-techs"
        label:
          en_US: "Surgical"
      - value: "emts-paramedics"
        label:
          en_US: "EMS"
      - value: "medical-assistants"
        label:
          en_US: "Medical assistants"
      - value: "dental"
        label:
          en_US: "Dental"
      - value: "admin"
        label:
          en_US: "Front desk & admin"
      - value: "allied-health"
        label:
          en_US: "Allied health"
      - value: "ai-training"
        label:
          en_US: "AI training"
  - name: limit
    type: number
    required: false
    label:
      en_US: "Number of results"
    human_description:
      en_US: "How many of the newest jobs to return for a state (1 to 25)."
    llm_description: "How many of the newest jobs to return for a state (1 to 25). Default 10."
    form: llm
    default: 10
    min: 1
    max: 25
    precision: 0
extra:
  python:
    source: tools/get_healthcare_jobs_by_state.py
